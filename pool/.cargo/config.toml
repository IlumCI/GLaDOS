# This file exists to escape the kernel's target, and for nothing else.
#
# `../.cargo/config.toml` sets `build.target = "x86_64-unknown-uefi"`, and
# cargo walks up from the working directory, so a bare `cargo build` in here
# would try to build a server as a UEFI application. Cargo has no way to
# *unset* an inherited key, so the only way out is to name one, and the closest
# config wins.
#
# The triple named is this development machine's, which is the one place a
# `cargo test` is ever actually typed. Anywhere the pool is really deployed --
# CI, a server -- passes `--target` explicitly and overrides this line:
#
#     cargo build --release --target x86_64-unknown-linux-musl
#
# **This said `x86_64-pc-windows-msvc`, and the development machine moved.**
# The reasoning was right and the fact under it expired: cargo cannot unset an
# inherited key, so escaping the kernel's UEFI target means naming one, and the
# one to name is whatever host actually types `cargo test`. That host is Arch
# Linux now, and until this line changed a bare `cargo build` in here answered
#
#     error[E0463]: can't find crate for `std`
#     note: the `x86_64-pc-windows-msvc` target may not be installed
#
# which is a build for a machine that is not here any more. Nothing about the
# crate was wrong and nothing about the reasoning was wrong; the triple was a
# measurement of the room, and the room changed.
#
# It is still true that every *other* host must pass `--target`, and that is
# still how this goes wrong -- `pool.yml` once built with one and tested
# without, so the tests looked for a Windows std on a Linux runner and the job
# failed every release it ever ran on. The failure simply points the other way
# now, so read the triple before believing a linker error.
[build]
target = "x86_64-unknown-linux-gnu"

# **This said "cleared, not inherited" and held `rustflags = []`, and it was
# wrong.** Cargo merges config files by *joining* arrays, so an empty list
# contributes nothing and the parent's flags arrive whole. Checked with
# `cargo config get build.rustflags` in this directory, which answered the
# kernel's list verbatim.
#
# It cost the pool's CI. `/MAP:target/glados.map` is an MSVC flag that
# `link.exe` accepts, so on the development machine's Windows target the build
# worked and wrote a stray map file; under musl, `rust-lld -flavor gnu` reads
# it as a filename and cannot link. `pool.yml` therefore failed on the step
# after `--target` was added to it, for a second and unrelated reason.
#
# Nothing replaces it here, because the parent scopes those flags to
# `[target.x86_64-unknown-uefi]` now and they never reach this crate at all --
# which is the fix, since the only way to not inherit a cargo array is for the
# parent not to declare it where it applies.

# Cross-compiling to musl, which is how the daemon is actually built. This
# stays exactly as it was when the host was Windows, and the reason is no
# longer "there is no `cc` here" -- there is one now, and `gcc` beside it.
# There is no **`musl-gcc`**, which is the one that would matter, and cargo's
# default linker for a musl target is a C compiler targeting musl.
#
# `rust-lld` ships with the toolchain and can link a fully static musl binary
# with no C toolchain anywhere, which is the whole reason musl is the target
# rather than gnu. It is written down here rather than exported by hand,
# because a hand-set environment variable is how a build silently leaves the
# *previous* binary in place -- which happened once during this work and looks
# exactly like a change that did nothing. The same class of failure `drive.py`
# records about preferring the release artefact.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

# Present for the day the host is an ARM box. Untested -- nothing has been
# built for it -- and listed so the setting is one line rather than a
# rediscovery.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
