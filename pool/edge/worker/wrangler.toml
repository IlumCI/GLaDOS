# The GLaDOS pool as a Cloudflare Worker with one Durable Object.
#
# Deployed from this directory: `npx wrangler deploy`. The WebAssembly core is
# built first -- `cargo build --release --manifest-path pool/edge/Cargo.toml
# --target wasm32-unknown-unknown` -- and imported by path, so a stale build is
# what gets deployed if that step is skipped. `tools/edgedeploy.sh` does both.
name = "glados-pool"
main = "worker.js"
compatibility_date = "2025-09-01"

# Miners connect at wss://pool.aperture.institute/mine; the share log is
# https://pool.aperture.institute/ledger.json. A custom domain rather than a
# route: Cloudflare creates the DNS record and the certificate itself, and
# workers.dev keeps working beside it for images already cut.
routes = [{ pattern = "pool.aperture.institute", custom_domain = true }]
# Explicit, because adding a route turns workers.dev off by default -- and the
# images already running and already cut dial glados-pool.*.workers.dev.
workers_dev = true

# Paid plan: allow a single invocation up to 5 minutes of CPU. On the default
# limit the main shard was being reset mid-alarm ("exceeded its CPU time limit")
# and every route queued behind it answered "overloaded". The alarm now logs
# which phase is slow when one runs over a second, so this can come back down.
[limits]
cpu_ms = 300000

[[durable_objects.bindings]]
name = "POOL"
class_name = "Pool"

# **SQLite-backed, because that is the only kind the free plan allows.** A
# key-value-backed class is refused on Workers Free; the ledger is written through
# the ordinary `storage.put`, which SQLite-backed objects support.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pool"]

[vars]
# Four zpool upstreams -- yescrypt, yespowerR16, yespowerURX, yescryptR16 --
# each checked against zpool acceptance with a burn address before it went in
# (URX 6/7 and yescryptR16 24/30 accepted; every refusal "Invalid job id").
# URX's key "UraniumX" is from AdventureCoin's sugarmaker YespowerUrx.c and
# cpu-pool's docs. SUGAR and ADVC were left out: their whole zpool pots are
# $0.87 and $0.27 a day, which one laptop would flood.
#
# Paid out in Ravencoin to the operator's address, and every
# miner moved to whichever pays best per unit of its work (SWITCH). Labels are
# zpool's algorithm names, which is how the live rates find them.
#
# The address is the operator's, never a miner's: the pool is an auto-exchange,
# and proceeds land in one place to be spent on one market buy. RVN because
# zpool's minimum there is 0.05 RVN, so a payout can happen the same day --
# chosen over DOGE for being visible, at the cost of a worse swap later.
COINS = "yescrypt:yescrypt:12@yescrypt.mine.zpool.ca:6233,RCmy8SHUHnACVobxf8vpzum5ms7nPXFU4f,c=RVN yespowerR16:yespower-10-4096-16:10@yespowerr16.mine.zpool.ca:6534,RCmy8SHUHnACVobxf8vpzum5ms7nPXFU4f,c=RVN yespowerURX:yespower-10-2048-32-5572616e69756d58:10@yespowerurx.mine.zpool.ca:6236,RCmy8SHUHnACVobxf8vpzum5ms7nPXFU4f,c=RVN yescryptR16:yescryptr16:10@yescryptr16.mine.zpool.ca:6333,RCmy8SHUHnACVobxf8vpzum5ms7nPXFU4f,c=RVN"
SHARE_SECONDS = "45"
SWITCH = "1"
# Whole GLADOS a miner's payout address must hold on chain 4663 to connect;
# "0" is off. 1,000,000 since 2026-09-30, raised from 50,000 on community
# feedback; the payout gate reads the same value.
GATE_MIN = "1000000"
# Durable Objects the miners are split across. 1 behaves exactly as before
# sharding (shard 0 is the original "main" object and keeps its record); raise
# it from the soak's measured shares/s per shard, not from a guess.
SHARDS = "1"
# GPU miners connect at /mine/gpu and are served by shards of their own
# ("gpu-N"), so CPU and GPU switching never compete for one slot choice.
# NeoScrypt since 2026-10-18, replacing HeavyHash: a browser GPU earns about
# 118 times as much on it (zpool's realized rates; 110k H/s of NeoScrypt
# against 79k of HeavyHash on an RTX 3050, and HeavyHash is ASIC country). The
# miner's kernel is checked against two Feathercoin blocks and every hit is
# re-hashed on the CPU before it is sent; 18 bits is a first share in seconds,
# and vardiff takes it from there.
GPU_COINS = "neoscrypt:neoscrypt:18@neoscrypt.mine.zpool.ca:4233,RCmy8SHUHnACVobxf8vpzum5ms7nPXFU4f,c=RVN"
GPU_SHARDS = "1"
# The payout treasury (runner.js): "off", "dry" -- reads balances, decides,
# logs what it would do, moves nothing -- or "live". RVN_BATCH is how much RVN
# accumulates before a swap; the swap waits for the larger of it and ChangeNOW's
# live minimum (300.49 RVN on 2026-10-18, ~151 before), so a batch under that
# minimum lets swaps follow ChangeNOW down if it lowers it. TREASURY_MAX_PAY_WEI
# caps one payout, and a payout over it halts the treasury instead of going out.
TREASURY = "live"
TREASURY_RVN = "RCmy8SHUHnACVobxf8vpzum5ms7nPXFU4f"
TREASURY_EVM = "0xfaE492EA62AA2250E0Ab2d1a6331E3c991443Cc5"
RVN_BATCH = "150"
TREASURY_MAX_PAY_WEI = "50000000000000000"
# Change this (any new value) and redeploy to resume a halted treasury, once.
TREASURY_RESUME = ""
# The payout floor as a fraction of the work-weighted median miner's work in a
# round: a wallet under it carries its work to the next round. "0.05" since
# 2026-10-18 (was "0.25"); "0" would pay every wallet that did any work.
MIN_FRAC = "0.05"
# The 4663 RPC endpoints are an ordered list in rpc.js -- Robinhood's own
# first, five measured public fallbacks after it. RPC_URLS (whitespace-
# separated) replaces the list. A keyed provider's URL carries its key, so it
# goes in as a secret, never here: `npx wrangler secret put RPC_URLS`.

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
