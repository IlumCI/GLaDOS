# The GLaDOS pool as a Cloudflare Worker with one Durable Object.
#
# Deployed from this directory: `npx wrangler deploy`. The WebAssembly core is
# built first -- `cargo build --release --manifest-path pool/edge/Cargo.toml
# --target wasm32-unknown-unknown` -- and imported by path, so a stale build is
# what gets deployed if that step is skipped. `tools/edgedeploy.sh` does both.
name = "glados-pool"
main = "worker.js"
compatibility_date = "2025-09-01"

# Miners connect at wss://pool.aperture.institute/mine; the share log is
# https://pool.aperture.institute/ledger.json. A custom domain rather than a
# route: Cloudflare creates the DNS record and the certificate itself, and
# workers.dev keeps working beside it for images already cut.
routes = [{ pattern = "pool.aperture.institute", custom_domain = true }]
# Explicit, because adding a route turns workers.dev off by default -- and the
# images already running and already cut dial glados-pool.*.workers.dev.
workers_dev = true

[[durable_objects.bindings]]
name = "POOL"
class_name = "Pool"

# **SQLite-backed, because that is the only kind the free plan allows.** A
# key-value-backed class is refused on Workers Free; the ledger is written through
# the ordinary `storage.put`, which SQLite-backed objects support.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pool"]

[vars]
# Four zpool upstreams -- yescrypt, yespowerR16, yespowerURX, yescryptR16 --
# each checked against zpool acceptance with a burn address before it went in
# (URX 6/7 and yescryptR16 24/30 accepted; every refusal "Invalid job id").
# URX's key "UraniumX" is from AdventureCoin's sugarmaker YespowerUrx.c and
# cpu-pool's docs. SUGAR and ADVC were left out: their whole zpool pots are
# $0.87 and $0.27 a day, which one laptop would flood.
#
# Paid out in Ravencoin to the operator's address, and every
# miner moved to whichever pays best per unit of its work (SWITCH). Labels are
# zpool's algorithm names, which is how the live rates find them.
#
# The address is the operator's, never a miner's: the pool is an auto-exchange,
# and proceeds land in one place to be spent on one market buy. RVN because
# zpool's minimum there is 0.05 RVN, so a payout can happen the same day --
# chosen over DOGE for being visible, at the cost of a worse swap later.
COINS = "yescrypt:yescrypt:12@yescrypt.mine.zpool.ca:6233,RRNXJhigAxiLJTRrDKu7fsDknTkXbx1Uz9,c=RVN yespowerR16:yespower-10-4096-16:10@yespowerr16.mine.zpool.ca:6534,RRNXJhigAxiLJTRrDKu7fsDknTkXbx1Uz9,c=RVN yespowerURX:yespower-10-2048-32-5572616e69756d58:10@yespowerurx.mine.zpool.ca:6236,RRNXJhigAxiLJTRrDKu7fsDknTkXbx1Uz9,c=RVN yescryptR16:yescryptr16:10@yescryptr16.mine.zpool.ca:6333,RRNXJhigAxiLJTRrDKu7fsDknTkXbx1Uz9,c=RVN"
SHARE_SECONDS = "45"
SWITCH = "1"
# Whole GLADOS a miner's payout address must hold on chain 4663 to connect;
# "0" is off. 50000 is the runbook's gate.
GATE_MIN = "50000"
# Durable Objects the miners are split across. 1 behaves exactly as before
# sharding (shard 0 is the original "main" object and keeps its record); raise
# it from the soak's measured shares/s per shard, not from a guess.
SHARDS = "1"
# GPU miners connect at /mine/gpu and are served by shards of their own
# ("gpu-N"), so CPU and GPU switching never compete for one slot choice.
# HeavyHash is the one GPU algorithm in our stack (cuda/heavyhash.cuh, OBTC);
# zpool accepted 11/11 of its forwarded shares when it was first driven.
GPU_COINS = "heavyhash:heavyhash:24@heavyhash.mine.zpool.ca:5138,RRNXJhigAxiLJTRrDKu7fsDknTkXbx1Uz9,c=RVN"
GPU_SHARDS = "1"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
