# The GLaDOS pool as a Cloudflare Worker with one Durable Object.
#
# Deployed from this directory: `npx wrangler deploy`. The WebAssembly core is
# built first -- `cargo build --release --manifest-path pool/edge/Cargo.toml
# --target wasm32-unknown-unknown` -- and imported by path, so a stale build is
# what gets deployed if that step is skipped. `tools/edgedeploy.sh` does both.
name = "glados-pool"
main = "worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "POOL"
class_name = "Pool"

# **SQLite-backed, because that is the only kind the free plan allows.** A
# key-value-backed class is refused on Workers Free; the ledger is written through
# the ordinary `storage.put`, which SQLite-backed objects support.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pool"]

[vars]
# Two zpool upstreams, paid out in Ravencoin to the operator's address, and every
# miner moved to whichever pays best per unit of its work (SWITCH). Labels are
# zpool's algorithm names, which is how the live rates find them.
#
# The address is the operator's, never a miner's: the pool is an auto-exchange,
# and proceeds land in one place to be spent on one market buy. RVN because
# zpool's minimum there is 0.05 RVN, so a payout can happen the same day --
# chosen over DOGE for being visible, at the cost of a worse swap later.
COINS = "yescrypt:yescrypt:12@yescrypt.mine.zpool.ca:6233,RRNXJhigAxiLJTRrDKu7fsDknTkXbx1Uz9,c=RVN yespowerR16:yespower-10-4096-16:10@yespowerr16.mine.zpool.ca:6534,RRNXJhigAxiLJTRrDKu7fsDknTkXbx1Uz9,c=RVN"
SHARE_SECONDS = "45"
SWITCH = "1"
# Whole GLADOS a miner's payout address must hold on chain 4663 to connect;
# "0" is off. 50000 is the runbook's gate. Off while the operator's own mining
# address holds none -- turning it on now would refuse the operator's rig.
GATE_MIN = "0"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true
