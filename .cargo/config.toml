# Floating point on a UEFI target, and why this is not the arrangement we want.
#
# The stock x86_64-unknown-uefi target declares:
#
#     "features":   "-mmx,-sse,+soft-float"
#     "rustc-abi":  "softfloat"
#
# The second line is the awkward one. It is an *ABI* declaration, not a codegen
# switch -- it says floats are passed in integer registers. So disabling
# soft-float with `-C target-feature` below is, strictly, lying to the compiler
# about its own ABI, and rustc now warns that this "will become a hard error in
# a future release".
#
# It works today, and the semantics are actually sound for us: the stock target
# picks softfloat because firmware makes no promise about FP state, and GLaDOS
# makes that promise itself in cpu::enable_simd(), which sets CR4.OSFXSR before
# a single float executes. Hardware float is also the normal Microsoft x64
# convention (floats in xmm0-3), so this is closer to the real UEFI ABI, not
# further from it. Nothing we hand to firmware takes a float argument.
#
# THE PROPER FIX IS ALREADY IN THE REPO: x86_64-glados.json, the stock spec with
# SSE enabled and `rustc-abi: softfloat` removed. It cannot be used yet.
# A custom target has no precompiled core, so it needs -Zbuild-std, and
# build-std must compile compiler_builtins' *build script* -- a host binary.
# This machine has no MSVC linker (rustup installed the msvc toolchain without
# its prerequisites), no Windows SDK, and only 32-bit MinGW.org. There is
# nothing here that can link a host executable.
#
# To switch over, install either:
#   * Visual Studio Build Tools with the C++ workload and Windows SDK, or
#   * mingw-w64, plus `rustup toolchain install nightly-x86_64-pc-windows-gnu`
#
# then delete the rustflags below and restore the [unstable] block:
#     [build]
#     target = "x86_64-glados.json"
#     [unstable]
#     json-target-spec = true
#     build-std = ["core", "alloc", "compiler_builtins"]
#     build-std-features = ["compiler-builtins-mem"]
#
# Until then this is a known fuse: a rustc release that promotes the warning to
# an error breaks the build. Pin the toolchain in rust-toolchain.toml if that
# becomes a real risk before the linker situation is resolved.

[build]
target = "x86_64-unknown-uefi"

# AVX is deliberately absent. Enabling it globally would let the compiler emit
# AVX anywhere, including early boot before CR4.OSXSAVE and XCR0 are set, where
# every such instruction raises #UD. AVX is opted into per function with
# #[target_feature], guarded by runtime detection.
rustflags = [
    "-C", "target-feature=+sse,+sse2,-soft-float",
]
