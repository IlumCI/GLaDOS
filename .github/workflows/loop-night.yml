name: loop-night

# The CI Godel machine's night: follow main, reconsider, propose, judge,
# adopt. Four jobs under ONE concurrency group, which is what makes
# fast-forward-only real -- there is never a second night interleaving with
# this one, so adopt's fetch-then-commit is atomic in the only sense that
# matters here.
#
# The machine's whole world is `loop/*`. Its token has `contents: write`
# and no `workflows` write, so GitHub itself rejects any push touching
# `.github/workflows/**`; the audit PR is how its work reaches a human, and
# `main` is reachable only through that human.
#
# CONSUMER: loop/main's ledger (the next night reads it), the rolling audit
# PR (the operator reads it), and ci.yml, which re-verifies every push to
# loop/** with a job the loop does not control. CANARY: the three Phase 1
# drills -- broken-candidate refused end to end, stale detected at adopt,
# a hand-edited certificate refused by fsck -- plus fsck halting the whole
# night on a corrupted ledger, proven in godel.py's own selftest.
#
# The cron stays commented until the Phase 1 exit proof is green, per the
# plan: a schedule is the last thing a loop earns.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "propose and judge, but adopt writes nothing"
        type: boolean
        default: false
      # `author_target` was here, and it is gone on purpose. It carried the
      # note that an unattended targeting policy is a design decision rather
      # than a default, which was correct while the loop had no goal: without
      # one, nothing but a human could say which file the model should touch.
      #
      # `loop/goal.txt` is that policy now. The open rung names its own target
      # and its own kind, so the night needs no input at all -- which is the
      # whole requirement: the operator writes one line, and the rest is the
      # system. An input left here would be a hand on the wheel every night.
  # schedule:
  #   - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: loop-main
  cancel-in-progress: false

jobs:
  # --- follow: the machine follows main, never the reverse -----------------
  follow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tip: ${{ steps.tip.outputs.tip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loop/main
          fetch-depth: 0

      - name: A corrupted ledger judges nothing
        run: python3 tools/godel.py fsck --root .

      - name: Follow main, and record what it overrode
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "already carries main"
          else
            # First find out WHAT conflicts, then let main win. A conflict
            # here is the operator having overridden an adoption, and the
            # ledger records the override instead of pretending it did not
            # happen -- main is the human authority.
            set +e
            git merge --no-commit --no-ff origin/main >/dev/null 2>&1
            set -e
            conflicted=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            if [ -n "$conflicted" ]; then
              git checkout --theirs -- .
              git add -A
              parent=$(git rev-parse 'HEAD^{tree}')
              git commit -m "loop: follow main, which overrode: $conflicted"
              cand=$(git rev-parse 'HEAD^{tree}')
              # Counted the safe way; see the long note in loop-judge.yml. `ls` on an
              # absent directory exits 2 and `pipefail` makes that the shell's last word.
              n=0
              if [ -d loop/ledger/entries ]; then
                n=$(ls -1 loop/ledger/entries | wc -l)
              fi
              seq=$(( n + 1 ))
              point=$(printf 'superseded by main at %s over %s' \
                "$(git rev-parse origin/main)" "$conflicted" | sha256sum | cut -d' ' -f1)
              python3 tools/godel.py cert --emit \
                --set "seq=$seq" --set "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --set "point=$point" --set "kind=event" --set "rung=1" \
                --set "axis=grid" --set "parent-tree=$parent" \
                --set "candidate-tree=$cand" --set "rail=none" \
                --set "corpus=00000000" --set "alpha-k=0" --set "chi-bar=-" \
                --set "minutes=0" --set "half=extend" --set "level=0" \
                --set "boots=0" --set "queries=0" --set "sections=0/0" --set "suites=0/0" \
                --set "claims=0/0" --set "witness=-" --set "moved=-" \
                --set "why=main overrode: $conflicted" \
                --set "verdict=superseded" \
                --set "runner=${{ github.run_id }}/${{ github.run_attempt }}" \
                > /tmp/superseded.cert
              name=$(sha256sum /tmp/superseded.cert | cut -c1-16)
              mkdir -p loop/ledger/entries
              cp /tmp/superseded.cert "loop/ledger/entries/$name.cert"
              git add loop/ledger/entries
              git commit -m "loop: a superseded entry for what main overrode"
            else
              git commit -m "loop: follow main" || echo "nothing to merge"
            fi
            python3 tools/godel.py fsck --root .
            git push origin HEAD:loop/main
          fi

      - name: Where the night grows from
        id: tip
        run: echo "tip=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # --- propose: reconsider, pick, mark BEFORE trying, stage the candidate --
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: follow
    permissions:
      contents: write
      # `models: read` was here for GitHub Models, which has been retired.
      # The author runs inside the job now and asks nothing of any token, so
      # the permission is removed rather than left as a dead grant.
    outputs:
      point: ${{ steps.pick.outputs.point }}
      rail: ${{ steps.pick.outputs.rail }}
      alpha_k: ${{ steps.pick.outputs.alpha_k }}
      chi_bar: ${{ steps.pick.outputs.chi_bar }}
      minutes: ${{ steps.pick.outputs.minutes }}
      half: ${{ steps.pick.outputs.half }}
      level: ${{ steps.pick.outputs.level }}
      boots: ${{ steps.pick.outputs.boots }}
      queries: ${{ steps.pick.outputs.queries }}
      kind: ${{ steps.pick.outputs.kind }}
      rung: ${{ steps.pick.outputs.rung }}
      axis: ${{ steps.pick.outputs.axis }}
      corpus: ${{ steps.pick.outputs.corpus }}
      baseline: ${{ steps.pick.outputs.baseline }}
      candidate: ${{ steps.pick.outputs.candidate }}
      have: ${{ steps.pick.outputs.have }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.follow.outputs.tip }}
          fetch-depth: 0

      # Clade before axis, as the kernel orders it. Under MIN_EVIDENCE (6)
      # trials below the head this answers "stay" by construction, so early
      # nights report and move on; when it answers Back, the backtrack is a
      # real commit -- the target tree restored, the ledger carried forward
      # whole, and a `rollback` event entry appended -- through the same
      # index plumbing adopt uses, so the worktree never mediates.
      - name: Reconsider, and go if the record says go
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          d=$(python3 tools/godel.py reconsider --root . --emit)
          echo "clade says: $d"
          case "$d" in back=*) ;; *) exit 0;; esac
          back=${d#back=}; back=${back%% *}
          target=${d##*target=}
          parent=$(git rev-parse 'HEAD^{tree}')
          # Counted the safe way; see the long note in loop-judge.yml. `ls` on an
          # absent directory exits 2 and `pipefail` makes that the shell's last word.
          n=0
          if [ -d loop/ledger/entries ]; then
            n=$(ls -1 loop/ledger/entries | wc -l)
          fi
          seq=$(( n + 1 ))
          point=$(printf 'rollback %s steps to %s from %s' "$back" "$target" "$parent"             | sha256sum | cut -d' ' -f1)
          # The commit's tree: the target, with the CURRENT ledger overlaid
          # (a rollback that rolled back its own record would be a lineage
          # erasing the decision that moved it), plus the event entry.
          python3 tools/godel.py cert --emit             --set "seq=$seq" --set "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --set "point=$point" --set "kind=event" --set "rung=1"             --set "axis=grid" --set "parent-tree=$parent"             --set "candidate-tree=$target" --set "rail=none"             --set "corpus=00000000" --set "alpha-k=0" --set "chi-bar=-"             --set "minutes=0" --set "half=extend" --set "level=0"             --set "boots=0" --set "queries=0" --set "sections=0/0" --set "suites=0/0"             --set "claims=0/0" --set "witness=-" --set "moved=-"             --set "why=the clade chose an ancestor: back $back"             --set "verdict=rollback"             --set "runner=${{ github.run_id }}/${{ github.run_attempt }}"             > /tmp/rollback.cert
          name=$(sha256sum /tmp/rollback.cert | cut -c1-16)
          blob=$(git hash-object -w /tmp/rollback.cert)
          export GIT_INDEX_FILE=/tmp/rb-index
          git read-tree "$target"
          git rm -r --cached loop/ledger --quiet 2>/dev/null || true
          git read-tree --prefix=loop/ledger/ 'HEAD:loop/ledger'
          git update-index --add --cacheinfo             "100644,$blob,loop/ledger/entries/$name.cert"
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          new=$(git commit-tree "$tree" -p HEAD -m "loop: rollback $back to ${target:0:12} (seq $seq)")
          git checkout -f --detach "$new"
          python3 tools/godel.py fsck --root .
          git push origin "$new:refs/heads/loop/main"

      # **The author runs here, in the job, and needs no credential.**
      #
      # GitHub Models retired mid-loop -- `HTTP 410
      # github_models_retirement_brownout` -- and the property it was chosen
      # for was "the workflow's own token, no new credential". A model in the
      # job restores that better than the hosted endpoint ever had it: there
      # is no token at all, and a pinned tarball plus a pinned GGUF are two
      # files with digests, which do not get retired.
      #
      # It also makes the author **re-derivable**, which a hosted endpoint
      # could never be: fixed weights, fixed build number, temperature zero.
      # A certificate naming a rung-4 proposal now names something a later
      # run can reproduce, which is the rule `frontier()` already states --
      # the next point is a function of the markers, not a coin.
      - uses: actions/cache@v4
        with:
          path: out/models
          # Keyed on the manifests, so repinning either the runtime or the
          # weights misses the cache by construction. `fetchmodel.py` checks
          # the digest again on a hit regardless: a restored cache is a
          # transfer too, and this tree does not trust transfers.
          key: author-${{ hashFiles('tools/models/*.txt') }}

      - name: The author it will ask
        id: author
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/fetchmodel.py tools/models/llama-cpp.txt --out out/models
          python3 tools/fetchmodel.py tools/models/bonsai-4b.txt --out out/models
          tar -xzf out/models/llama-b11071-bin-ubuntu-x64.tar.gz -C out/models
          bin=out/models/llama-b11071
          chmod +x "$bin"/llama-server "$bin"/llama-quantize

          # **Q2_0 has no x86 kernel**, so it runs scalar: 2.18 t/s prefill
          # against TQ2_0's 17.33 at four threads, measured. That is the
          # difference between a rung in two minutes and a request that times
          # out at ten, which is how this was found. `llama-quantize` is in
          # the tarball already, the conversion takes about a minute, and it
          # is byte-reproducible -- so the derived file is pinned like any
          # other rather than hosted somewhere by somebody.
          tq=out/models/Ternary-Bonsai-4B-TQ2_0.gguf
          if [ ! -f "$tq" ]; then
            "$bin"/llama-quantize --allow-requantize \
              out/models/Ternary-Bonsai-4B-Q2_0_g64.gguf "$tq" TQ2_0
          fi
          python3 tools/fetchmodel.py tools/models/bonsai-4b.txt \
            --out out/models --check-derived
          # The shared objects sit beside the binary in the tarball, and
          # nothing guarantees an RPATH survives extraction.
          LD_LIBRARY_PATH="$PWD/$bin" "$bin"/llama-server \
            -m "$tq" \
            --host 127.0.0.1 --port 8080 -c 8192 -t 4 --threads-batch 4 \
            > out/models/server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null 2>&1; then
              # `--no-warmup` was here and is deliberately gone. It defers
              # the weight load to the first request, so `/health` answered
              # in **4 seconds** and the completion then timed out -- a
              # server that is up by every check available and cannot answer
              # anything yet. The cost moves into this wait, where it shows.
              echo "  the server answered after ${i}s"
              echo "GLADOS_INFERENCE_URL=http://127.0.0.1:8080/v1/chat/completions" \
                >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          # `continue-on-error`, deliberately. A night with no inference is a
          # night that authored nothing, which is an ordinary outcome: the
          # grid, `discover` and the template families need no model and are
          # most of what the loop can do. The step goes red so somebody sees
          # it; the night carries on.
          echo "::error::llama-server never answered on 127.0.0.1:8080"
          tail -40 out/models/server.log || true
          exit 1

      # **The operator writes one line and the machine writes the rest.**
      # `loop/goal.txt` is the north star; this keeps the ladder under it
      # stocked. A rung is a milestone with a witness, so a night always has
      # something to aim at that is not "walk the grid again" -- which is
      # where the kernel-side machine stopped, eight points and then nothing.
      #
      # It asks GitHub Models with this workflow's own token and no new
      # credential, and everything the reply could do is refused by
      # `ladder.py` before it is a rung: prose outside the fence, two fences,
      # a kind with no witness, a stale goal hash, a sequence that skips, a
      # target outside the kind's masks or inside the evaluator, or a line
      # trying to declare the `point` that would mark it met.
      #
      # A refusal is the ordinary outcome and not a failure. The night goes on
      # to the grid; retrying with more context is how a fence contract stops
      # being one.
      - name: Keep the ladder stocked
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if python3 tools/ladder.py next --root . >/dev/null 2>&1; then
            echo "  a rung is already open:"
            python3 tools/ladder.py next --root .
            exit 0
          fi
          set +e
          out=$(python3 tools/ladder.py propose --root . 2>&1); code=$?
          set -e
          echo "$out"
          if [ "$code" != "0" ]; then
            echo "::notice::no new rung tonight; the grid still has work"
            exit 0
          fi
          git add loop/ladder
          git commit -m "loop: a rung toward the north star"
          git push origin HEAD:loop/main

      - name: Pick the next point, and mark it tried before anything runs
        id: pick
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          python3 tools/godel.py next --root . --emit-env /tmp/env.txt > /tmp/account.txt
          code=$?
          set -e
          if [ "$code" != "0" ]; then
            # **The target comes from the ladder, not from a dispatch input.**
            # It was `inputs.author_target`, under a comment saying an
            # unattended targeting policy is a design decision rather than a
            # default -- which was right when there was no goal. There is one
            # now, so the open rung names the file and the kind, and the
            # operator is out of the nightly path entirely.
            rung_target=""
            rung_kind="cleanup"
            if python3 tools/ladder.py next --root . --emit-env /tmp/rung.env >/dev/null 2>&1; then
              rung_target=$(awk -F= '$1=="RUNG_TARGET"{print $2}' /tmp/rung.env)
              rung_kind=$(awk -F= '$1=="RUNG_KIND"{print $2}' /tmp/rung.env)
            fi
            if grep -q "every grid point is tried" /tmp/account.txt \
               && [ -n "$rung_target" ]; then
              # The composed core's rule, ported: the model authors only
              # when everything cheaper is out of moves. Its reply is held
              # by the fence contract, admit(), and then the whole gate.
              set +e
              python3 tools/godel.py author --root . \
                --kind "$rung_kind" --target "$rung_target" \
                --emit-env /tmp/env.txt > /tmp/account.txt
              code=$?
              set -e
              if [ "$code" != "0" ]; then
                echo "have=no" >> "$GITHUB_OUTPUT"
                echo "::notice::the author refused or was refused:"
                cat /tmp/account.txt || true
                exit 0
              fi
              # The author emits point= only; the account is recomputed the
              # way every account figure is.
              {
                python3 tools/godel.py alpha --root . \
                  | sed -n 's/.*: \([0-9]*\) of 32.*/alpha_k=\1/p'
                echo "chi_bar=-"
                echo "rail=none"
                python3 tools/godel.py oops --root . --axis model \
                  | sed -E 's/.*(extend|fresh) at level ([0-9]+) -- ([0-9]+) minutes, ([0-9]+) boot.*/half=\1\nlevel=\2\nminutes=\3\nboots=\4/'
              } >> /tmp/account.txt
            else
              echo "have=no" >> "$GITHUB_OUTPUT"
              echo "::notice::nothing to propose tonight:"
              cat /tmp/account.txt || true
              exit 0
            fi
          fi
          cat /tmp/account.txt
          # The account, as outputs (key=value already).
          while IFS='=' read -r k v; do
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done < /tmp/account.txt
          point=$(awk -F= '$1=="point"{print $2}' /tmp/account.txt)
          echo "have=yes" >> "$GITHUB_OUTPUT"
          echo "kind=$(awk '$1=="kind"{print $2}' /tmp/env.txt)" >> "$GITHUB_OUTPUT"
          echo "rung=$(awk '$1=="rung"{print $2}' /tmp/env.txt)" >> "$GITHUB_OUTPUT"
          echo "axis=$(awk '$1=="axis"{print $2}' /tmp/env.txt)" >> "$GITHUB_OUTPUT"
          echo "corpus=$(awk '$1=="corpus"{print $2}' /tmp/env.txt)" >> "$GITHUB_OUTPUT"

          # Marker before trial: an interrupted night has still spent the
          # night -- godel.rs writes its marker at the same moment for the
          # same reason.
          mkdir -p loop/ledger/tried
          cp /tmp/env.txt "loop/ledger/tried/${point:0:16}.env"
          git add loop/ledger/tried
          git commit -m "loop: tried ${point:0:16}"
          git push origin HEAD:loop/main
          echo "baseline=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # The candidate: parent tree + the patch, as a real commit on its
          # own ref, derived through plumbing so the worktree stays the
          # baseline's.
          parent=$(git rev-parse 'HEAD^{tree}')
          cand_tree=$(python3 tools/godel.py derive /tmp/env.txt --parent "$parent")
          cand=$(git commit-tree "$cand_tree" -p HEAD -m "loop: candidate ${point:0:16}")
          git push origin "$cand:refs/heads/loop/cand/${point:0:16}"
          echo "candidate=$cand" >> "$GITHUB_OUTPUT"

  # --- judge: the two-arm gate, in its own workflow ------------------------
  judge:
    needs: propose
    if: needs.propose.outputs.have == 'yes'
    uses: ./.github/workflows/loop-judge.yml
    with:
      point: ${{ needs.propose.outputs.point }}
      baseline_ref: ${{ needs.propose.outputs.baseline }}
      candidate_ref: ${{ needs.propose.outputs.candidate }}
      rail: ${{ needs.propose.outputs.rail }}
      chi_bar: ${{ needs.propose.outputs.chi_bar }}
      alpha_k: ${{ needs.propose.outputs.alpha_k }}
      minutes: ${{ needs.propose.outputs.minutes }}
      half: ${{ needs.propose.outputs.half }}
      level: ${{ needs.propose.outputs.level }}
      boots: ${{ needs.propose.outputs.boots }}
      queries: ${{ needs.propose.outputs.queries }}
      kind: ${{ needs.propose.outputs.kind }}
      rung: ${{ needs.propose.outputs.rung }}
      axis: ${{ needs.propose.outputs.axis }}
      corpus: ${{ needs.propose.outputs.corpus }}

  # --- a dry run leaves no candidate ref behind -----------------------------
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [propose, judge]
    if: always() && needs.propose.outputs.have == 'yes' && inputs.dry_run
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          POINT: ${{ needs.propose.outputs.point }}
        run: git push origin --delete "loop/cand/${POINT:0:16}" || true

  # --- adopt: the only writer of entries, serialized, staleness-checked ----
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [propose, judge]
    if: needs.propose.outputs.have == 'yes' && !inputs.dry_run
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loop/main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: loopjudge-${{ needs.propose.outputs.point }}
          path: /tmp/judge

      - name: Adopt, refuse, or find the world moved
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/godel.py cert --check /tmp/judge/certificate.cert
          cert=/tmp/judge/certificate.cert
          parent=$(awk '$1=="parent-tree"{print $2}' "$cert")
          cand=$(awk '$1=="candidate-tree"{print $2}' "$cert")
          verdict=$(awk '$1=="verdict"{print $2}' "$cert")
          point=$(awk '$1=="point"{print $2}' "$cert")
          live=$(git rev-parse 'HEAD^{tree}')

          # **The one honest edit a certificate ever receives, before it is
          # frozen**: the judge answered about a parent that is no longer
          # the tip, so its verdict cannot land -- whatever it was. The
          # entry records `stale` and the point re-authors from the new tip
          # under a new name, because parent-tree is inside the envelope
          # hash.
          if [ "$parent" != "$live" ]; then
            sed -i "s/^verdict .*/verdict stale/" "$cert"
            verdict=stale
            echo "::notice::the tip moved mid-judge; filed as stale"
          fi
          # seq is re-derived under the lock, where it is authoritative.
          # Counted the safe way; see the long note in loop-judge.yml. `ls` on an
          # absent directory exits 2 and `pipefail` makes that the shell's last word.
          n=0
          if [ -d loop/ledger/entries ]; then
            n=$(ls -1 loop/ledger/entries | wc -l)
          fi
          seq=$(( n + 1 ))
          sed -i "s/^seq .*/seq $seq/" "$cert"

          # Pure plumbing from here: the commit's tree is built in an
          # index, so the worktree is never mutated and there is no
          # deleted-file / stale-file class of mistake to make. On an
          # adoption the base is the candidate tree (which already carries
          # tonight's marker -- it derives from the post-marker tip); on a
          # refusal it is the live tree. Either way the one addition is the
          # certificate, so code and record land in one commit and are
          # inseparable in history.
          name=$(sha256sum "$cert" | cut -c1-16)
          blob=$(git hash-object -w "$cert")
          base=$([ "$verdict" = "adopt" ] && echo "$cand" || echo "$live")
          export GIT_INDEX_FILE=/tmp/adopt-index
          git read-tree "$base"
          git update-index --add --cacheinfo \
            "100644,$blob,loop/ledger/entries/$name.cert"
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          new=$(git commit-tree "$tree" -p HEAD -m "loop: $verdict ${point:0:16} (seq $seq)")
          git checkout -f --detach "$new"
          python3 tools/godel.py fsck --root .
          git push origin "$new:refs/heads/loop/main"
          git push origin --delete "loop/cand/${point:0:16}" || true

      - name: The rolling audit PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tail=$(python3 tools/godel.py ledger --root . --tail 10)
          body=$(printf 'The CI loop ledger, newest last:\n\n```\n%s\n```\n\nEvery entry is a content-named certificate under loop/ledger/entries, re-verified by ci.yml on every push to this branch. Merging is yours; the machine only ever writes here.' "$tail")
          n=$(gh pr list --head loop/main --base main --state open --json number --jq length)
          if [ "$n" = "0" ]; then
            gh pr create --head loop/main --base main \
              --title "The loop ledger" --body "$body"
          else
            num=$(gh pr list --head loop/main --base main --state open --json number --jq '.[0].number')
            gh pr edit "$num" --body "$body"
          fi
