name: release

# Tagged releases: build the kernel image, sign it, publish it to the stable
# channel, and attach it to the GitHub release as well.
#
# Two independent places on purpose. The bucket is what the in-OS updater
# reads; the release assets are what a person checks it against, and a
# signature is only worth having if somebody can get the artifact a second way.
#
# The ISOs are built here too, which they were not. The reason they were not is
# still true -- the payloads are hundreds of megabytes of model weights that
# exist nowhere in this repo -- so they are fetched from a pinned release that
# holds them, verified against digests that DO live in this repo
# (payload/*.txt), and only then handed to mkiso.py.
#
# Updates still ship the EFI image alone. An ISO is how a machine is installed,
# not how it is updated, and nothing in `update` will ever pull 576 MB through
# a 32 KB window.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign, but publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not actions-rs/toolchain. It does `rustup override set`, which sits
      # ABOVE rust-toolchain.toml in rustup's precedence -- so the pinned
      # nightly and the x86_64-unknown-uefi target this repo declares would
      # both be ignored, silently. That is the bug in rust-clippy.yml.
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version --verbose
          rustc --print target-list | grep -qx x86_64-unknown-uefi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: uefi-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # The crate has no dependencies by policy, the target is tier 2 with a
      # precompiled core, and rust-lld ships with rustup -- so this needs no
      # cross toolchain and no MSVC.
      - name: Build
        run: cargo build --release --locked

      - name: The tag and Cargo.toml must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "Cargo.toml says $crate, the tag says $tag."
            echo "VERSION is what the updater compares to decide whether an"
            echo "image is newer, so a mismatch here ships a wrong answer."
            exit 1
          fi
          echo "VERSION=$crate" >> "$GITHUB_ENV"

      - name: Version, for a manual run
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Sign
        env:
          KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$KEY" || { echo "UPDATE_SIGNING_KEY is not set"; exit 1; }
          mkdir -p out
          cp target/x86_64-unknown-uefi/release/glados.efi "out/glados-$VERSION.efi"
          python3 tools/sign.py "out/glados-$VERSION.efi" "out/glados-$VERSION.efi.sig" --key "$KEY"

      - name: Build the signed manifest
        env:
          KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          ORIGIN: ${{ vars.SUPABASE_URL }}
        run: |
          test -n "$ORIGIN" || { echo "the SUPABASE_URL variable is not set"; exit 1; }
          python3 tools/manifest.py "out/glados-$VERSION.efi" \
            --version "$VERSION" \
            --channel stable \
            --base "$ORIGIN/storage/v1/object/public/stable" \
            --notes "release $VERSION" \
            --key "$KEY" \
            --out out

      # Reads it back with the parser the kernel uses, against the key the
      # kernel pins. A manifest that CI cannot read is one that fails on every
      # machine that already trusts us, at the moment they try to update.
      - name: Verify what we are about to publish
        run: python3 tools/manifest.py --verify out/manifest --image "out/glados-$VERSION.efi"

      - name: Publish to the stable channel
        if: startsWith(github.ref, 'refs/tags/') || inputs.dry_run == false
        env:
          ORIGIN: ${{ vars.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          put() {
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/octet-stream" \
              -H "x-upsert: true" \
              --data-binary "@$1" \
              "$ORIGIN/storage/v1/object/stable/$2"
            echo "  put $2"
          }
          # The image before the manifest, and this order is load-bearing: a
          # manifest naming an object that is not there yet is a window in
          # which every machine that checks gets a 404 for an update it was
          # just told about.
          put "out/glados-$VERSION.efi" "glados-$VERSION.efi"
          put "out/glados-$VERSION.efi.sig" "glados-$VERSION.efi.sig"
          put "out/manifest" "manifest"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag does not create a release, and `gh release upload`
          # needs one to exist -- which is how this step failed on 1.2.28
          # after everything else had already published correctly.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Assets published by CI. Notes written by hand."
          gh release upload "$GITHUB_REF_NAME" \
            "out/glados-$VERSION.efi" \
            "out/glados-$VERSION.efi.sig" \
            out/manifest --clobber

      # --- the ISO ------------------------------------------------------
      #
      # Last, and deliberately after the image and the manifest are already
      # published. An ISO is an install medium and nothing waits on it, while
      # every machine in the field is waiting on the manifest -- so a failure
      # down here must not be able to delay what is above it.

      # No `if:` on the next three, deliberately. Gating them on a real
      # release would mean the only run that ever exercises them is the one
      # that is not allowed to fail -- a dry run would skip exactly the path
      # it was invoked to rehearse. Downloading 600 MB costs four minutes on a
      # workflow that runs on tags and by hand, which is cheap against
      # discovering the fetch is broken during a release.
      - name: Fetch the payload
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_TAG: ${{ vars.PAYLOAD_TAG || 'payload-qwen3-0.6b-v1' }}
        run: |
          mkdir -p payload-dir
          # A release of its own, holding only weights. Not the repo (600 MB
          # of binary that git would carry forever), not LFS (whose free
          # bandwidth this would exhaust in three builds), and not the
          # Supabase bucket the images go to -- that egress is metered and
          # this is not.
          gh release download "$PAYLOAD_TAG" --dir payload-dir --clobber
          ls -la payload-dir

      - name: The payload must be the payload
        run: |
          # The step this whole arrangement exists for. A truncated download
          # builds an ISO that boots and then cannot load the model, and
          # nothing else in this workflow knows how long model.bin should be.
          python3 tools/payload.py --selftest
          python3 tools/payload.py verify payload-dir "payload/${PAYLOAD_NAME}.txt"
        env:
          PAYLOAD_NAME: ${{ vars.PAYLOAD_NAME || 'qwen3-0.6b' }}

      - name: Build the ISO
        run: |
          python3 tools/mkiso.py "out/glados-$VERSION.iso" \
            --efi "out/glados-$VERSION.efi" \
            --payload payload-dir \
            --label "GLADOS"
          ls -la "out/glados-$VERSION.iso"

      - name: Attach the ISO
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Separate from the attach above so that an ISO upload failing --
          # it is 576 MB and the one asset here big enough to time out --
          # cannot take the kernel image down with it.
          gh release upload "$GITHUB_REF_NAME" "out/glados-$VERSION.iso" --clobber
