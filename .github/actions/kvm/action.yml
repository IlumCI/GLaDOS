name: kvm
description: >
  Make /dev/kvm writable by the runner user, deterministically. One copy,
  because the second one went stale and cost a red run.

# **This existed in `verify-boot/action.yml` and nowhere else, and three
# other call sites carried their own shorter copy of it.** The short copy is
# the version that races: `udevadm trigger` queues the event and returns, so
# the `test -w /dev/kvm` after it runs before udev has applied the rule and
# fails often enough to matter. That was measured once already -- two runs of
# one commit two minutes apart went one each way, and the loser reported
# `/dev/kvm is not writable` after a step lasting 52 ms, which is three sudo
# calls and no time at all for udev.
#
# `verify-boot` was fixed; `evidence-boot.yml` and `evidence-floors.yml` were
# not, because nobody knew there were other copies. `evidence-boot` then
# failed on its first ever run, at `test -w /dev/kvm`, in the one job that
# had the unfixed copy -- the same race, rediscovered from scratch.
#
# So it is one action now. Same argument as `oops --emit` replacing a regular
# expression over prose, and as `adopt-decide` replacing four lines of shell:
# two copies of a decision are two copies free to drift, and the one that
# drifts is the one nobody is looking at.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        if [ ! -e /dev/kvm ]; then
          echo "::error::/dev/kvm is absent. This runner cannot accelerate,"
          echo "::error::and under TCG this job costs 24+ minutes rather"
          echo "::error::than one."
          exit 1
        fi

        # A udev rule rather than a chmod, because the node is recreated.
        printf 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"\n' \
          | sudo tee /etc/udev/rules.d/99-kvm-writable.rules >/dev/null
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

        # The line the short copies are missing. Without it the test below
        # races udev and loses; see the note at the top of this file.
        sudo udevadm settle --timeout=10 || true

        # And a direct chmod as the belt to that brace. The rule is what
        # survives the node being recreated, which is why it stays; this is
        # what makes the job deterministic rather than lucky. Guarded, so it
        # runs only when the rule did not take.
        test -w /dev/kvm || sudo chmod 666 /dev/kvm || true

        test -w /dev/kvm || { echo "::error::/dev/kvm is not writable"; exit 1; }
        echo "kvm is available and writable"
