[package]
name = "glados"
version = "0.1.0"
edition = "2021"
description = "A from-scratch ring-0 operating system for the MSI MS-16R8"

# No dependencies, deliberately. Everything here is written from scratch.
#
# That is a choice, not a constraint. This comment used to claim build.rs and
# proc-macro crates were impossible because the toolchain had no host linker,
# and that claim steered several decisions -- including an assessment that
# vendoring a TLS implementation was off the table. It was never tested. It is
# false: `typenum`, which has a build script, compiles here in 24 seconds.
# Cargo finds MSVC through the registry even though link.exe is not on PATH.
#
# So dependencies remain absent because writing this from scratch is the point,
# and each one added would be a deliberate exception -- most likely for
# cryptography, where writing it from scratch is how you get a security bug
# rather than an education.
[dependencies]

[[bin]]
name = "glados"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
# There is no unwinder in a freestanding binary.
panic = "abort"
# opt-level 0 produces enormous stack frames, which matters a lot while we are
# still running on the firmware's modest boot stack. 1 is the safe floor.
opt-level = 1
overflow-checks = true

[profile.release]
panic = "abort"
opt-level = 2
lto = true
# Keep symbols: the QEMU gdb stub is our only source-level debugger.
debug = true
