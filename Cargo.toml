[package]
name = "glados"
version = "1.4.0"
edition = "2021"
description = "A from-scratch ring-0 operating system for the MSI MS-16R8"
publish = false

# One dependency, for fonts, and the reasons it is allowed are the policy.
#
# 1.4.x opens the tree to outside crates, on three conditions that hold for
# every one of them and are checked rather than intended:
#
#   * **Vendored.** `vendor/` holds the exact sources and `.cargo/config.toml`
#     replaces crates.io with it, so a build is offline and byte-for-byte the
#     code that was read. Updating a crate is a diff someone can review.
#   * **Audited.** `deny.toml` allows MIT, Apache-2.0, Zlib and the font
#     licences and nothing else, and refuses advisories; `cargo deny check`
#     runs in CI. A crate pulling in a GPL dependency fails the build rather
#     than the release.
#   * **Credited.** NOTICE.md names every crate and every font with its licence.
#
# Fonts are the only purpose so far, by decision: outline rasterising and its
# table parser are a large, solved, correctness-critical piece of work with no
# bearing on what makes this machine itself. Shapes, blur, glass and layout
# stay this tree's own.
#
# **What the old version of this comment said was true on Windows and is not
# on Arch.** It recorded that proc macros and build scripts failed for want of
# an MSVC host linker. Re-measured on the Arch host, 2026-10-10: `paste` (a proc
# macro) and `libm` (a build script) both compile for x86_64-unknown-uefi, and
# so do fontdue and ab_glyph. fontdue was chosen over ab_glyph on the
# measurement -- 0.65 us a glyph against 1.14-1.33 on Noto Sans and Cascadia
# Code at 16 px -- and neither reads GPOS kerning, which is why
# tools/fontsubset.py flattens it on the host.
[dependencies]
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }

[[bin]]
name = "glados"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
# There is no unwinder in a freestanding binary.
panic = "abort"
# opt-level 0 produces enormous stack frames, which matters a lot while we are
# still running on the firmware's modest boot stack. 1 is the safe floor.
opt-level = 1
overflow-checks = true

[profile.release]
panic = "abort"
# **Three. Two was costing the miner about a fifth of its speed.**
#
# Measured twice over, because the first attempt to measure it said the opposite.
# On the pool, which compiles `src/mine/yespower.rs` by `#[path]` and is therefore
# the same code the kernel runs, one yescrypt hash is 1541 us at 2 and 1061 at 3 --
# 1.45x, settled readings with the first discarded. In the kernel under KVM,
# `mine bench` on yescrypt over three readings on each of two boots per setting:
#
#     opt-level 2   113 116 116 100 114 110   median 113.5 H/s
#     opt-level 3   133 136 142 143 139 144   median 140   H/s
#
# 1.23x, and the gap to the pool's 1.45x is the kernel benching on core 0 beside
# the clock and the compositor.
#
# **A single reading said 167 at opt-level 2 and nearly reverted this.** It was an
# outlier, and taking it at face value would have kept a setting that costs a fifth
# of the hash rate. Three readings on each of two boots is what it takes here; one
# is not a measurement, which this tree says in four other places.
#
# `[profile.dev]` above states why it holds 1 rather than 0 -- boot stack frames on
# the firmware's stack. Nothing ever stated why release held 2. The cost of 3 is
# 4.2% of image size, 250 KB, against a 2 GB ISO ceiling dominated by weights, and
# `diag all` reads 68 of 68 with the machine alive afterwards.
opt-level = 3
lto = true
# Keep symbols: the QEMU gdb stub is our only source-level debugger.
debug = true
